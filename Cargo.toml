[workspace]
resolver = "3"
members = ["crates/fc-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
authors = ["krocon"]
repository = "https://github.com/krocon/flac-commander"

[workspace.dependencies]
fc-core = { path = "crates/fc-core" }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Decoding in an unoptimised build is slow enough to cause dropouts in `tauri dev`:
# the audio crates are always optimised, our own code stays debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
