<section class="player" [attr.aria-label]="t.player">
  <div class="display">
    <p class="title" [class.empty]="!store.hasTrack()" [title]="store.track()?.path ?? ''">
      {{ view.title() }}
    </p>
    <p class="details">{{ view.details() }}</p>
    <app-visualizer class="visualizer" />
  </div>

  <div class="seek">
    <span class="time" aria-hidden="true">{{ view.position() }}</span>
    <input
      #seek
      type="range"
      min="0"
      step="1000"
      [max]="store.durationMs() ?? 0"
      [value]="store.positionMs()"
      [disabled]="!view.seekable()"
      [attr.aria-label]="t.position"
      [attr.aria-valuetext]="view.positionText()"
      (input)="store.previewSeek(seek.valueAsNumber)"
      (change)="store.commitSeek(seek.valueAsNumber)"
    />
    <span class="time" aria-hidden="true">{{ view.duration() }}</span>
  </div>

  <div class="controls">
    <button
      type="button"
      [attr.aria-label]="p.add"
      [title]="actions.hint('player.open')"
      (click)="playlist.open()"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 2 2.5 9h11zM2.5 11h11v2.5h-11z" />
      </svg>
    </button>
    <button
      type="button"
      [attr.aria-label]="p.previous"
      [title]="actions.hint('player.previous')"
      [disabled]="playlist.isEmpty()"
      (click)="playlist.previous()"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3 3h2v10H3zM13 3v10L6 8z" />
      </svg>
    </button>
    <button
      type="button"
      class="primary"
      [attr.aria-label]="store.isPlaying() ? t.pause : t.play"
      [title]="actions.hint('player.togglePlay')"
      (click)="store.togglePlay()"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true">
        @if (store.isPlaying()) {
          <path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z" />
        } @else {
          <path d="M4 2.5 13 8l-9 5.5z" />
        }
      </svg>
    </button>
    <button
      type="button"
      [attr.aria-label]="t.stop"
      [title]="actions.hint('player.stop')"
      [disabled]="!store.hasTrack() || store.status() === 'stopped'"
      (click)="store.stop()"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3 3h10v10H3z" />
      </svg>
    </button>
    <button
      type="button"
      [attr.aria-label]="p.next"
      [title]="actions.hint('player.next')"
      [disabled]="playlist.isEmpty()"
      (click)="playlist.next()"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M11 3h2v10h-2zM3 3v10l7-5z" />
      </svg>
    </button>
    <button
      type="button"
      class="toggle"
      [class.on]="playlist.repeat() !== 'off'"
      [attr.aria-label]="repeatLabel()"
      [title]="actions.hint('player.repeat')"
      (click)="playlist.cycleRepeat()"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path
          d="M4 4h7V2l3 3-3 3V6H5v3H3V5a1 1 0 0 1 1-1zM12 12H5v2l-3-3 3-3v2h6V7h2v4a1 1 0 0 1-1 1z"
        />
      </svg>
      @if (playlist.repeat() === 'one') {
        <span class="one" aria-hidden="true">1</span>
      }
    </button>
    <button
      type="button"
      class="toggle"
      [class.on]="playlist.shuffle()"
      [attr.aria-label]="p.shuffle"
      [attr.aria-pressed]="playlist.shuffle()"
      [title]="actions.hint('player.shuffle')"
      (click)="playlist.toggleShuffle()"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path
          d="M2 4h2.5l5 8H12v-2l3 3-3 3v-2H8.5l-5-8H2zM12 2l3 3-3 3V6H9.9L8.7 4H12zM2 12h1.5l1.3-2 1.1 1.8L4.5 14H2z"
        />
      </svg>
    </button>

    <div class="volume">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M2 6h3l4-3.5v11L5 10H2zM11 5.2a4 4 0 0 1 0 5.6v-1.6a2.4 2.4 0 0 0 0-2.4z" />
      </svg>
      <input
        #volume
        type="range"
        min="0"
        max="100"
        step="1"
        [value]="view.volumePercent()"
        [attr.aria-label]="t.volume"
        [attr.aria-valuetext]="t.percent(view.volumePercent())"
        (input)="store.previewVolume(volume.valueAsNumber / 100)"
        (change)="store.commitVolume()"
      />
      <span class="percent" aria-hidden="true">{{ t.percent(view.volumePercent()) }}</span>
    </div>
  </div>

  <div class="footer">
    <p class="status" role="status">{{ view.status() }}</p>
    @if (store.state().underruns > 0) {
      <p class="underruns">{{ t.underruns(store.state().underruns) }}</p>
    }
  </div>
  @if (errorText(); as error) {
    <p class="error" role="alert">{{ error }}</p>
  }
</section>
