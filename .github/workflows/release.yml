# Release build for FLAC Commander.
# A tag "vX.Y.Z" builds the packages for macOS, Linux and Windows and collects them in a
# DRAFT GitHub release; publishing the draft is a manual step.
# A pull request that changes this file runs the same build without a release and keeps the
# packages as workflow artifacts, so the workflow is tested before a tag depends on it.
# The builds are unsigned (docs/RISKS.md R12); macOS gets an ad-hoc signature.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Packages (${{ matrix.name }})
    permissions:
      contents: write # creates the draft release and uploads the packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04 # the oldest runner: the packages then start on older distributions too
            args: --bundles deb,rpm,appimage
            rust-targets: ''
          - name: Windows x64
            os: windows-latest
            args: --bundles msi,nsis
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: The tag matches the version in package.json and Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          cargo="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          echo "tag=$tag package.json=$pkg Cargo.toml=$cargo"
          [ "$tag" = "$pkg" ] && [ "$tag" = "$cargo" ]

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev cmake rpm

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-' # ad-hoc: without it Apple Silicon calls the download "damaged"
        with:
          args: ${{ matrix.args }}
          # Only a tag creates a release; every other run just builds.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'FLAC Commander __VERSION__'
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true

      - name: Keep the packages of a trial run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
