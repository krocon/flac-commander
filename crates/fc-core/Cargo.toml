[package]
name = "fc-core"
description = "FLAC Commander core: audio engine and application logic without any UI or Tauri dependency"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
cpal = "0.18.2"
log.workspace = true
serde.workspace = true
# Decoders are chosen explicitly: every enabled format has a decode test (tests/formats.rs).
symphonia = { version = "0.6.1", default-features = false, features = [
    "opt-simd", "all-meta",
    "aac", "aiff", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav",
] }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Phase 0 evaluation only (examples/probe.rs); becomes a dependency with the metadata module (Phase 3).
lofty = "0.25.5"
# Lock-free SPSC ring buffer between decoder thread and audio callback (examples/play.rs);
# becomes a dependency with the playback engine (Phase 2).
rtrb = "0.4.1"

[lints]
workspace = true
